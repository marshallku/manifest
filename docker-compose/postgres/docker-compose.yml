services:
  postgres:
    image: postgres:18.6-alpine3.23
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      # Absolute, not ~: `sudo docker compose up` expands ~ to /root, mounts an empty
      # directory, and initdb starts a fresh cluster (2026-10-22, 26h outage).
      - /home/marshall/data/postgres:/var/lib/postgresql/18/docker
      - /mnt/hdd/backup/postgres:/backup
