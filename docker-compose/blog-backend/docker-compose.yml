services:
    database:
        image: mongo:8.2.3
        restart: always
        container_name: blog-database
        ports:
            - ${MONGO_PORT}:27017
        networks:
            internal_network:
        environment:
            - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
            - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
        volumes:
            - /mnt/hdd/data/blog-backend/db:/data/db
            - /mnt/hdd/data/blog-backend/config:/data/configdb
    api:
        restart: unless-stopped
        container_name: blog-api
        image: ghcr.io/marshallku/blog-backend:latest
        depends_on:
            - database
        ports:
            - 48312:${PORT}
        env_file:
            - .env
        environment:
            - HOST=0.0.0.0
            # 도커 브리지 게이트웨이 IP 대신 compose 서비스 이름을 쓴다 —
            # 172.18.0.1 은 네트워크가 다시 만들어지면 바뀔 수 있다.
            - MONGO_HOST=blog-database
            - MONGO_PORT=27017
            - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
            - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME}
            - TEMPLATE_PATH=templates/**/*.html
        networks:
            internal_network:
            app_network:

networks:
    app_network:
        # 손으로 만들어야 한다 — compose 가 만들지 않는다:
        #     docker network create app_network
        # 이 스택 말고는 아무도 붙어 있지 않아서(prd01 에서 containers=0) 실제로
        # 값을 하는 건 없지만, 없으면 `up` 이 "declared as external, but could not
        # be found" 로 거부한다. 2026-09-09 app01 이관에서 그렇게 막혔다.
        external: true
    internal_network:
