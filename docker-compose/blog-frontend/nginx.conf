# marshallku.com 의 정적 산출물만 서빙한다. TLS·차단·리다이렉트·ACME 는 전부
# 엣지(marshallku/edge) 소관이고 여기로 내려오지 않는다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # 엣지가 etag off 로 서빙해 왔다. 프록시가 되면 업스트림 ETag 가 그대로
    # 지나가므로, 응답 헤더를 그대로 두려면 여기서도 꺼야 한다.
    etag off;

    # gzip 은 엣지가 이미 한다(gzip_proxied any). 여기서 또 하면 두 번 압축한다.
    gzip off;

    server_tokens off;

    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
