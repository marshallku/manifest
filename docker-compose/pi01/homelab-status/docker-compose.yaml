# homelab-status — one small JSON document describing the whole homelab.
#
# Written for an ESP32-S3 shelf display (marshallku/esp32, `homelab-display`),
# which has no clock, a fixed-size JSON parser and a 400x300 monochrome panel.
# All the aggregation that would be painful on the device happens here: group
# rollups, only the monitors that are actually down, and per-node gauges.
#
# This belongs on pi01 for the same reason uptime-kuma does. Kuma's database is
# read locally, so the display keeps reporting *which* things are down during a
# prd01 outage — the one moment it is worth looking at. Prometheus lives in the
# cluster and dies with prd01, so its absence degrades to `hosts.ok = false`
# instead of failing the document.
#
# `python:*-alpine` with the script bind-mounted, because aggregate.py uses only
# the standard library — there is nothing to build and no image to publish. The
# tag is multi-arch, which this host requires (arm64).

services:
    homelab-status:
        image: python:3.13-alpine
        container_name: homelab-status
        restart: unless-stopped
        command: ["python3", "-u", "/app/aggregate.py"]
        ports:
            - "8080:8080"
        # STATUS_TOKEN — the bearer token the display presents. Kept out of
        # argv and out of git; see .env.example.
        env_file:
            - .env
        environment:
            # In-cluster Prometheus, reached over the LAN on its NodePort.
            - PROM_URL=http://192.168.219.100:30090
            - KUMA_DB=/kuma/kuma.db
            - REFRESH_SEC=30
            # The device shows a STALE banner past this age. Keep it a few
            # refresh intervals wide so a single slow scrape is not an alarm.
            - STALE_AFTER_SEC=180
            - TZ=Asia/Seoul
        volumes:
            - ./aggregate.py:/app/aggregate.py:ro
            # Read-only, and read-only in SQLite too (`mode=ro` + query_only).
            # The live WAL is read in place: copying a 26 MB database every
            # refresh would burn the SD card this host is careful about.
            - /var/lib/homelab/uptime-kuma:/kuma:ro
        healthcheck:
            test:
                [
                    "CMD",
                    "python3",
                    "-c",
                    "import os,sys,json,urllib.request; r=urllib.request.Request('http://127.0.0.1:8080/homelab.json'); t=os.environ.get('STATUS_TOKEN'); r.add_header('Authorization','Bearer '+t) if t else None; sys.exit(0 if json.load(urllib.request.urlopen(r,timeout=5)).get('ready') else 1)",
                ]
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 30s
