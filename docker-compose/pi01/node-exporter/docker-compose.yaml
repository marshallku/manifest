# node-exporter for pi01, scraped over the LAN by the in-cluster Prometheus.
#
# pi01 is not a k3s node, so the monitoring DaemonSet does not reach it. This is
# the same arrangement already used for the Mac mini: a plain container here, a
# static_configs target in kubernetes/monitoring/prometheus/configmap.yaml.
#
# Image tag and flags are kept identical to the in-cluster DaemonSet so the
# exported series and their labels line up across every host.

services:
    node-exporter:
        image: prom/node-exporter:v1.10.2
        container_name: node-exporter
        restart: unless-stopped
        network_mode: host
        pid: host
        command:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            # `$$` escapes compose interpolation; node-exporter receives a single `$`.
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
            - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/host/root:ro,rslave
