# Jellyfin — media server (host: storage01).
#
# The library lives on `tank`, a ZFS mirror of two ST8000DM004 drives. Those are
# DM-SMR: sustained *sequential* writes are fine (measured 129-161 MB/s across a
# 35 GiB run, no cliff), but a stream of small random writes collapses them to
# ~10-20 MB/s once the CMR cache zone fills. So the split below is not a
# preference, it is the constraint the whole host is arranged around:
#
#   /config, /cache  -> NVMe   (library DB, image cache, transcoding scratch)
#   /media           -> virtiofs -> tank  (the video files themselves)
#
# /cache is what makes this matter in practice — Jellyfin writes transcoding
# segments there continuously while a client is playing.

services:
    jellyfin:
        image: jellyfin/jellyfin:10.11.11
        container_name: jellyfin
        restart: unless-stopped
        # Runs as the unprivileged `marshall` (1000:1000) rather than root; the
        # bind mounts below are owned by that uid on both the NVMe side and,
        # through virtiofs, on the host's ZFS datasets.
        user: "1000:1000"
        ports:
            - "8096:8096"
        environment:
            - TZ=Asia/Seoul
            # Without this Jellyfin advertises a container-internal address to
            # clients that discover it on the LAN.
            - JELLYFIN_PublishedServerUrl=http://192.168.219.191:8096
        volumes:
            - /var/lib/homelab/jellyfin/config:/config
            - /var/lib/homelab/jellyfin/cache:/cache
            # Read-only: Jellyfin never needs to write into the library, and this
            # removes any path by which a library scan can damage the originals.
            - /mnt/media:/media:ro
        # The GTX 1060 (Pascal, NVENC) reached this VM on 2026-09-10 — the card was
        # already sitting in pve02 doing nothing, so the earlier reasoning ("the
        # CPU copes, and passthrough binds the card to one VM") no longer costs
        # anything: nothing else wants it.
        #
        # This block only grants ACCESS. Jellyfin still has to be told to use it,
        # in Dashboard -> Playback -> Hardware acceleration (NVENC), which lives in
        # /config/encoding.xml and is application state, not compose.
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        # ⚠️ 3GB of VRAM, shared with Immich's ML. Two simultaneous 4K HEVC
        # transcodes can exhaust it; NVENC then fails rather than falling back, so
        # watch `nvidia-smi` the first time both are under real load.
