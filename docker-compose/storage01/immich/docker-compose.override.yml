# Immich overrides (host: storage01).
#
# `docker-compose.yml` next to this file is vendored verbatim from upstream:
#
#   https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# It is committed unmodified so that `diff`-ing it against a new release shows
# only what upstream changed. Every local decision belongs in this file instead.
#
# Upstream mounts a single `${UPLOAD_LOCATION}:/data`, which puts originals,
# thumbnails and transcoded video on the same filesystem. That is wrong here:
# `tank` is a ZFS mirror of two DM-SMR drives, and while large sequential writes
# are fine on them, thumbnail generation is exactly the pattern that kills SMR —
# thousands of small files written at once. A single library import would drag
# the pool into its read-modify-write path for hours.
#
# So the two directories Immich churns are pulled back onto the NVMe, and only
# the originals (`library/`, `upload/`) stay on the mirror:
#
#   /data/thumbs         -> NVMe
#   /data/encoded-video  -> NVMe
#   /data/*  (rest)      -> virtiofs -> tank
#
# Consequence to be aware of: these two directories are now outside whatever
# snapshot/replication covers `tank`. That is acceptable because both are
# derived data — Immich regenerates them from the originals — but it does mean a
# restore is not complete until regeneration has run.

services:
    immich-server:
        volumes:
            - /var/lib/homelab/immich/thumbs:/data/thumbs
            - /var/lib/homelab/immich/encoded-video:/data/encoded-video

    # Face recognition and CLIP embeddings ran on CPU over 172 GB of photos until
    # the GTX 1060 reached this VM (2026-09-10).
    #
    # The card is Pascal (compute 6.1), which is the thing to check before
    # switching: cuDNN dropped Maxwell/Pascal/Volta in 9.11, and upstream's CUDA
    # image pins `libcudnn9-cuda-12=9.10.2.21` — deliberately the last release that
    # still covers this card. Verify that pin still holds when bumping
    # IMMICH_VERSION, because the tag alone does not tell you.
    immich-machine-learning:
        image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        # ⚠️ 3GB of VRAM, shared with Jellyfin's NVENC (see
        # ../jellyfin/docker-compose.yaml). Inference here plus two simultaneous
        # 4K HEVC transcodes can exhaust it, and NVENC fails rather than falling
        # back to software — so watch `nvidia-smi` the first time both are under
        # real load together.
