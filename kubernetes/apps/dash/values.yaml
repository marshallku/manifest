# dash — the homelab dashboard (https://github.com/marshallku/dash).
#
# Tier C. The rendered page is an inventory of internal hosts, ports and
# operational notes, so it must not go out over the tunnel: no `host`, a
# NodePort instead, and one nginx server block on edge01 under
# `dash.in.marshallku.dev`.
#
# The binary itself knows nothing about this homelab — every fact arrives at
# runtime as DASH_CONFIG_YAML, which is why that repo can be public while this
# deployment is not. The config lives only in the SealedSecret next to this
# file (kubernetes/service/dash/) and on the author's machine.
app: dash

surfaces:
  web:
    image: ghcr.io/marshallku/dash:latest
    port: 8080
    # No `host:` on purpose — a host renders a tunnel Ingress and this
    # page would be on the public internet. edge01 fronts this port.
    nodePort: 30800
    healthPath: /healthz
    secretEnv:
      # The entire dash.yaml as one key. The binary prefers this over
      # the DASH_CONFIG path, so there is no volume to mount and no
      # chart change beyond the NodePort above. See
      # ../../service/dash/README.md for how to reseal it.
      - DASH_CONFIG_YAML
      # Referenced from dash.yaml as ${...}; an unset one aborts startup
      # rather than sending a blank Authorization header.
      - STATUS_TOKEN
      - INFLUX_TOKEN
    resources:
      requests: { cpu: 10m, memory: 24Mi }
      limits: { memory: 96Mi }
