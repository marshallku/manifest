# Factory app values (source: marshallku/toon-factory deploy/values.yaml).
# Namespace prerequisites (PV/PVC, sealed secrets) are in deploy/service/ → manifest kubernetes/service/toon-factory/.
#
# replicas 1 + Recreate: SQLite and content-addressed assets on a hostPath PV, one render-queue worker.
# Memory: strip composition holds a few 800×10000 RGBA images, ffmpeg renders 1080×1920 shorts, and the reel editor
# runs one heavy job at a time in the pod: a HyperFrames render (headless Chrome, one capture worker) or whisper.cpp
# transcription (large-v3-turbo q5, ~1 GB). Two capture workers did not fit 3 GB.
app: toon-factory

surfaces:
  web:
    image: ghcr.io/marshallku/toon-factory:21f1a4e1ea6d68ac0f1405cb14d5cdeed1fc608c
    port: 8080
    # Tailnet only: no `host` (that would render a public tunnel Ingress). prd01's nginx fronts this NodePort as
    # toon.in.marshallku.dev with the tailscale-only ACL (marshallku/edge).
    nodePort: 30810
    healthPath: /healthz
    replicas: 1
    strategy: Recreate
    env:
      - name: PUBLIC_ORIGIN
        value: https://toon.in.marshallku.dev
      # No TRUST_PROXY_HEADER: there is no cloudflared in front anymore, so CF-Connecting-IP would be client-supplied.
      - name: BRIDGE_URL
        value: https://10.10.0.50:8941
      - name: MEDIA_BRIDGE_URL
        value: https://10.10.0.51:8942
      - name: MEDIA_BRIDGE_CERT_SHA256
        value: 0b323ef7228c722fec6320dc748a9e2da7804cec8637f476486df223d034b056
    secretEnv:
      - PASSWORD_HASH
      - BRIDGE_TOKEN
      - BRIDGE_CERT_SHA256
      - MEDIA_BRIDGE_TOKEN
    volumes:
      - name: data
        claimName: toon-factory-data
        mountPath: /data
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { memory: 3Gi }
