# dong-marketer — @mrry.now content ops (source: private marshallku/dong-marketer, deploy/values.yaml).
# Namespace prerequisites (PV/PVC, sealed secrets) live in manifest kubernetes/service/dong-marketer/.
#
# AI runs only on the operator's subscriptions: llm-bridge on the Mac mini spawns claude/codex/agy
# (docs/plan-llm-bridge.md). Kagi is off (KAGI_URL=off); re-enable by adding a kagi surface + secrets.
#
# replicas 1 + Recreate is required: SQLite on a hostPath PV, single DM worker / job runner.
app: dong-marketer

surfaces:
  web:
    image: ghcr.io/marshallku/dong-marketer:51faeb41f056a37150405b6d979e2846f3706943
    port: 8080
    host: dong.marshallku.dev
    healthPath: /healthz
    replicas: 1
    strategy: Recreate
    env:
      - name: PUBLIC_ORIGIN
        value: https://dong.marshallku.dev
      - name: KAGI_URL
        value: "off"
      - name: BRIDGE_URL
        value: https://10.10.0.50:8941
      # media-bridge on the operator's desktop (docs/comfy.md); the fingerprint is public, the token is sealed.
      - name: MEDIA_BRIDGE_URL
        value: https://10.10.0.51:8942
      - name: MEDIA_BRIDGE_CERT_SHA256
        value: 0b323ef7228c722fec6320dc748a9e2da7804cec8637f476486df223d034b056
    secretEnv:
      - PASSWORD_HASH
      - BRIDGE_TOKEN
      - BRIDGE_CERT_SHA256
      - IG_APP_SECRET
      - IG_VERIFY_TOKEN
      - IG_ACCESS_TOKEN
      - IG_USER_ID
      - MEDIA_BRIDGE_TOKEN
    volumes:
      - name: data
        claimName: dong-marketer-data
        mountPath: /data
    resources:
      requests: { cpu: 20m, memory: 48Mi }
      limits: { memory: 256Mi }
