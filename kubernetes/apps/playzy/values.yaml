# playzy — toddler bedtime-story backend (AI gateway, ADR 0001), on the app
# factory. The public Playzy story API (api-playzy.marshallku.dev), with its
# Postgres quota store (ADR 0002) on shared db01.
#
# Prerequisites live in manifest kubernetes/service/playzy/ (sealed playzy-secret).
# Infisical was never bootstrapped here, which kept the pods in
# CreateContainerConfigError from 2026-09 to 2026-11; the database already exists,
# so `database.enabled` stays false.
#
# Generating a story still needs an AI provider, see kubernetes/service/playzy/README.md.
app: playzy

# The images are public.
imagePullSecret: ""

surfaces:
  api:
    image: ghcr.io/marshallku/playzy-backend:a919451f99b114dc9f57e2ec4814da8d1489e9c8 # CI-managed tag
    port: 8080
    host: api-playzy.marshallku.dev
    healthPath: /healthz
    env:
      - name: PLAYZY_ADDR
        value: ":8080"
      # Authoritative durable quota on shared Postgres (ADR 0002). REQUIRED +
      # fail-closed — a missing value aborts boot rather than silently using the
      # restart-volatile in-memory store.
      - name: PLAYZY_QUOTA_STORE
        value: postgres
    secretEnv:
      - PLAYZY_DATABASE_URL
      - PLAYZY_ADMIN_TOKEN

# No provisioning: the role and the database were created by hand.
database:
  enabled: false
