# aide-site — AIDE's homepage and manual (https://github.com/marshallku/aide-site).
#
# A static Astro build served by nginx-unprivileged on 8080. The repository and its GHCR package
# are public, so there is no pull secret and no secret at all. The repo's deploy workflow pushes
# ghcr.io/marshallku/aide-site:<sha> and rewrites the tag below (MANIFEST_REPO_TOKEN).
app: aide-site

imagePullSecret: ""

surfaces:
  web:
    image: ghcr.io/marshallku/aide-site:2b586e98a5eedff1848163fc9a50c60e71216e48
    port: 8080
    host: aide.marshallku.dev
    healthPath: /healthz
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
