# Moves personality.irang.me off the hand-managed `cloudflared-sssup` tunnel,
# whose routes live in the Zero Trust dashboard, onto the tunnel-ingress
# controller — so the hostname is declared here in git like every factory app.
#
# The controller reconciles both halves from this one object: it publishes the
# tunnel route AND writes the DNS CNAME. The old dashboard route for this
# hostname becomes dead weight once this is live and should be removed with it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: personality-web
  namespace: irang-dev
  labels:
    app: personality-web
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: personality.irang.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: personality-web
                port:
                  number: 3000
