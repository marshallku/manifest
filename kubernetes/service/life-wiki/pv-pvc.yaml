# life-wiki data: SQLite databases, uploads and pre-update backups.
# Static hostPath PV with Retain, like infisical — the chart only references
# this claim, so nothing ArgoCD prunes can delete the wiki's data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: life-wiki-data-pv
  labels:
    app.kubernetes.io/name: life-wiki
    app.kubernetes.io/part-of: life-wiki
spec:
  capacity:
    storage: 10Gi # informational: hostPath has no quota, uploads can fill the node disk
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/k3s-data/life-wiki
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s01
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: life-wiki-data
  namespace: life-wiki
  labels:
    app.kubernetes.io/name: life-wiki
    app.kubernetes.io/part-of: life-wiki
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: life-wiki-data-pv
