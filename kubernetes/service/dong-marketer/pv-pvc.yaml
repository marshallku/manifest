# dong-marketer data: SQLite (+ nightly VACUUM INTO backups) and generated images.
# Static hostPath PV with Retain, like life-wiki — the chart only references this claim, so nothing
# ArgoCD prunes can delete her rules, drafts and images. The image runs as UID 10001: the directory
# must be owned by it (see README — hostPath ignores fsGroup).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dong-marketer-data-pv
  labels:
    app.kubernetes.io/name: dong-marketer
    app.kubernetes.io/part-of: dong-marketer
spec:
  capacity:
    storage: 5Gi # informational: hostPath has no quota
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/k3s-data/dong-marketer
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s01
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dong-marketer-data
  namespace: dong-marketer
  labels:
    app.kubernetes.io/name: dong-marketer
    app.kubernetes.io/part-of: dong-marketer
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: dong-marketer-data-pv
