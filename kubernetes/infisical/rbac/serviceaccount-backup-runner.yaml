apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-runner
  namespace: infisical
  labels:
    app.kubernetes.io/name: backup-runner
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: infisical
# No pod ever runs as this account. It exists so that the backup runner on
# storage01 — which lives outside the cluster — can authenticate as something
# narrower than the `system:masters` kubeconfig that would otherwise be reused.
automountServiceAccountToken: false
---
# The token Secret lives in this file, breaking the one-kind-per-file layout
# used elsewhere in `kubernetes/infisical/`, because the two are order-
# dependent and nothing else would enforce the order. `kubectl apply -f rbac/`
# feeds files alphabetically, which puts any `secret-*.yaml` ahead of
# `serviceaccount-*.yaml`; the token controller then sees a Secret naming a
# ServiceAccount that does not exist yet and deletes it. The result is not an
# error — apply reports success and the cluster ends up with no token, so the
# failure only surfaces later as an authentication error in the nightly run.
# Observed on this cluster, not hypothesised. Keeping both documents in one
# file, account first, makes a clean bootstrap correct on the first pass.
apiVersion: v1
kind: Secret
metadata:
  name: backup-runner-token
  namespace: infisical
  annotations:
    kubernetes.io/service-account.name: backup-runner
  labels:
    app.kubernetes.io/name: backup-runner
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: infisical
type: kubernetes.io/service-account-token
# There is no `data:` block, and that is the point. The token controller fills
# in `data.token` and `data.ca.crt` inside the cluster; this file only asks for
# that to happen. Nothing secret is committed — which is why it sits here in
# `rbac/` rather than in `secrets/`, so that "only sealed-secret.yaml may be
# committed there" stays true by inspection.
#
# Omitting the key entirely rather than writing `data: {}` is load-bearing.
# A later `kubectl apply -R -f kubernetes/infisical/` three-way-merges against
# the last-applied annotation: an absent key leaves the controller's value
# alone, while an explicit empty map would erase the token and break the
# nightly run without any manifest visibly changing.
#
# Why a long-lived bound token instead of `kubectl create token`: the consumer
# is an unattended nightly job outside the cluster. Nobody is there to re-mint
# a short-lived token, and minting one would itself require a credential — the
# circularity this account exists to avoid. The accepted trade-off is a
# credential with no expiry, tolerable only because the Role bound to it
# reaches exactly one pod.
