{{- $root := . -}}
{{- $ns := include "workload.namespace" . -}}
{{- range $name, $surface := .Values.surfaces }}
{{- if $surface.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $root.Values.app }}-{{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "workload.labels" (dict "root" $root "surface" $name) | nindent 4 }}
  {{- with $surface.ingressAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $root.Values.ingressClassName }}
  rules:
    - host: {{ $surface.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $root.Values.app }}-{{ $name }}
                port:
                  number: {{ $surface.port }}
{{- end }}
{{- end }}
