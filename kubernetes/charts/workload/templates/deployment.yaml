{{- include "workload.validate" . -}}
{{- $root := . -}}
{{- $ns := include "workload.namespace" . -}}
{{- $secretName := include "workload.secretName" . -}}
{{- range $name, $surface := .Values.surfaces }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Values.app }}-{{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "workload.labels" (dict "root" $root "surface" $name) | nindent 4 }}
spec:
  replicas: {{ $surface.replicas | default 1 }}
  {{- with $surface.strategy }}
  strategy:
    type: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $root.Values.app }}-{{ $name }}
  template:
    metadata:
      labels:
        app: {{ $root.Values.app }}-{{ $name }}
        {{- include "workload.labels" (dict "root" $root "surface" $name) | nindent 8 }}
    spec:
      {{- with $root.Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $surface.volumes }}
      volumes:
        {{- range . }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ .claimName }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $surface.image | quote }}
          {{- with $surface.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $surface.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ $surface.port }}
          env:
            - name: PORT
              value: {{ $surface.port | quote }}
            {{- range $surface.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- range $surface.secretEnv }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ . }}
            {{- end }}
          {{- with $surface.volumes }}
          volumeMounts:
            {{- range . }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml ($surface.resources | default $root.Values.defaultResources) | nindent 12 }}
          {{- $health := $surface.healthPath | default "/" }}
          {{- with $surface.startupProbe }}
          startupProbe:
            httpGet:
              path: {{ $health }}
              port: {{ $surface.port }}
            periodSeconds: {{ .periodSeconds | default 10 }}
            failureThreshold: {{ .failureThreshold | default 30 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $health }}
              port: {{ $surface.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $health }}
              port: {{ $surface.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
{{- end }}
