{{- if .Values.secret.infisical.enabled }}
{{- $ns := include "workload.namespace" . -}}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "workload.secretName" . }}
  namespace: {{ $ns }}
spec:
  resyncInterval: {{ .Values.secret.infisical.resyncInterval | default 60 }}
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: {{ required "secret.infisical.projectSlug is required when infisical is enabled" .Values.secret.infisical.projectSlug | quote }}
        envSlug: {{ .Values.secret.infisical.envSlug | default "prd" | quote }}
        secretsPath: {{ .Values.secret.infisical.secretsPath | default "/" | quote }}
      credentialsRef:
        secretName: {{ .Values.secret.infisical.credentialsSecret | default "infisical-universal-auth" }}
        secretNamespace: {{ $ns }}
  managedSecretReference:
    secretName: {{ include "workload.secretName" . }}
    secretNamespace: {{ $ns }}
    creationPolicy: Owner
{{- end }}
