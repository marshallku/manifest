apiVersion: v1
kind: ConfigMap
metadata:
    name: alloy-config
    namespace: mgmt01
    labels:
        app: alloy
data:
    config.alloy: |
        // Cluster pod logs, read through the Kubernetes API.
        //
        // This was `discovery.docker` against /var/run/docker.sock until
        // 2026-09-29. k3s01 runs containerd, so that socket does not exist: the
        // pipeline logged a connection failure once a minute and shipped nothing
        // but the journal for as long as it had been deployed. Container logs on
        // the Docker host live in a second Alloy, docker-compose/monitoring/.

        discovery.kubernetes "pods" {
          role = "pod"

          // A DaemonSet member must only tail the pods on its own node, or every
          // pod's log is ingested once per node the moment the cluster grows a
          // second one.
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("NODE_NAME")
          }
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          // Names the source host the same way the app01 Alloy does, so one
          // LogQL selector can pick either.
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "host"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.write.default.receiver]
        }

        // Systemd journal log collection
        loki.source.journal "systemd" {
          path        = "/var/log/journal"
          forward_to  = [loki.process.journal.receiver]
          labels      = {
            job  = "systemd-journal",
            host = sys.env("NODE_NAME"),
          }
        }

        loki.process "journal" {
          stage.labels {
            values = {
              unit = "_SYSTEMD_UNIT",
            }
          }

          forward_to = [loki.write.default.receiver]
        }

        // Ship logs to Loki
        loki.write "default" {
          endpoint {
            url = "http://loki.mgmt01.svc.cluster.local:3100/loki/api/v1/push"
          }
        }
