apiVersion: v1
kind: ServiceAccount
metadata:
    name: alloy
    namespace: mgmt01
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: alloy
rules:
    - apiGroups: [""]
      resources:
          - nodes
          - namespaces
          - pods
      verbs: ["get", "list", "watch"]
    # loki.source.kubernetes tails through the API rather than off the node's
    # disk, so it needs to read the log subresource itself.
    - apiGroups: [""]
      resources:
          - pods/log
      verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: alloy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: alloy
subjects:
    - kind: ServiceAccount
      name: alloy
      namespace: mgmt01
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
    name: alloy
    namespace: mgmt01
    labels:
        app: alloy
spec:
    selector:
        matchLabels:
            app: alloy
    template:
        metadata:
            labels:
                app: alloy
        spec:
            serviceAccountName: alloy
            tolerations:
                - operator: Exists
            containers:
                - name: alloy
                  image: grafana/alloy:v1.13.0
                  args:
                      - run
                      - /etc/alloy/config.alloy
                      # Read offsets live here. On the node rather than the
                      # container filesystem: with an ephemeral path every
                      # restart re-reads each pod's log from the beginning, and
                      # Loki drops whatever is older than a week
                      # (reject_old_samples_max_age) while the replay eats into
                      # the per-stream rate limit that live logs need.
                      - --storage.path=/var/lib/alloy
                  env:
                      # The config's field selector narrows pod discovery to this
                      # node; without it every member of the DaemonSet would tail
                      # every pod in the cluster.
                      - name: NODE_NAME
                        valueFrom:
                            fieldRef:
                                fieldPath: spec.nodeName
                  ports:
                      - name: http
                        containerPort: 12345
                  resources:
                      requests:
                          cpu: 50m
                          memory: 64Mi
                      limits:
                          memory: 256Mi
                  volumeMounts:
                      - name: config
                        mountPath: /etc/alloy
                      - name: storage
                        mountPath: /var/lib/alloy
                      - name: journal
                        mountPath: /var/log/journal
                        readOnly: true
                      - name: machine-id
                        mountPath: /etc/machine-id
                        readOnly: true
            volumes:
                - name: config
                  configMap:
                      name: alloy-config
                - name: storage
                  hostPath:
                      path: /var/lib/alloy
                      type: DirectoryOrCreate
                - name: journal
                  hostPath:
                      path: /var/log/journal
                - name: machine-id
                  hostPath:
                      path: /etc/machine-id
