                            "rawSql": "SELECT uniqExact(user.anonymous_id) FROM core.events WHERE app_id = '${app}' AND env = '${env}' AND dataset = 'measure' AND $__timeFilter(est_occurred_at)",
                            "pluginVersion": "4.22.1"
