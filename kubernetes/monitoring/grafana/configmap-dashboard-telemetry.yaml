# Generated by telemetry-dashboards.py in this directory: edit the script, then
# `python3 telemetry-dashboards.py > configmap-dashboard-telemetry.yaml`.
# Panel queries read registry views (core.apps, core.funnels) instead of hard-coding apps.
apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-dashboard-telemetry
    namespace: mgmt01
    labels:
        app: grafana
data:
    telemetry-factory.json: |
        {
            "uid": "telemetry-factory",
            "title": "Telemetry · Factory Overview",
            "description": "앱 공장 전체의 제품 이벤트와 수집 파이프라인 상태",
            "tags": [
                "telemetry",
                "product"
            ],
            "timezone": "Asia/Seoul",
            "editable": true,
            "graphTooltip": 1,
            "schemaVersion": 39,
            "time": {
                "from": "now-30d",
                "to": "now"
            },
            "refresh": "1m",
            "templating": {
                "list": [
                    {
                        "name": "env",
                        "label": "env",
                        "type": "query",
                        "datasource": {
                            "type": "grafana-clickhouse-datasource",
                            "uid": "clickhouse-telemetry"
                        },
                        "query": {
                            "editorType": "sql",
                            "rawSql": "SELECT DISTINCT env FROM raw.events ORDER BY env",
                            "format": 1,
                            "queryType": "table",
                            "pluginVersion": "4.22.1"
                        },
                        "definition": "SELECT DISTINCT env FROM raw.events ORDER BY env",
                        "refresh": 1,
                        "hide": 0,
                        "sort": 1,
                        "includeAll": false,
                        "multi": false,
                        "options": [],
                        "current": {
                            "text": "demo",
                            "value": "demo"
                        }
                    }
                ]
            },
            "annotations": {
                "list": []
            },
            "links": [
                {
                    "title": "Telemetry",
                    "type": "dashboards",
                    "tags": [
                        "telemetry"
                    ],
                    "asDropdown": false,
                    "includeVars": true,
                    "keepTime": true
                }
            ],
            "panels": [
                {
                    "id": 1,
                    "type": "text",
                    "title": "",
                    "gridPos": {
                        "x": 0,
                        "y": 0,
                        "w": 24,
                        "h": 2
                    },
                    "options": {
                        "mode": "markdown",
                        "content": "**앱 공장 제품 이벤트 한눈에 보기.** 모든 수치는 `core.events`(중복 제거 뷰)에서, 시각은 수집기가 보정한 `est_occurred_at`(KST) 기준. `env=demo`는 `telemetry fake`가 만든 가짜 데이터다. 앱을 누르면 앱 상세로 간다."
                    }
                },
                {
                    "id": 2,
                    "type": "table",
                    "title": "앱별 상태 · 최근 7일",
                    "description": "actors는 measure 데이터셋의 익명 id 수다. session_only 앱은 방문 수와 같다. north_star는 레지스트리의 앱별 핵심 이벤트 수. freshness는 마지막 수신 후 경과 초.",
                    "datasource": {
                        "type": "grafana-clickhouse-datasource",
                        "uid": "clickhouse-telemetry"
                    },
                    "gridPos": {
                        "x": 0,
                        "y": 2,
                        "w": 24,
                        "h": 6
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "grafana-clickhouse-datasource",
                                "uid": "clickhouse-telemetry"
                            },
                            "editorType": "sql",
                            "format": 1,
                            "queryType": "table",
                            "rawSql": "SELECT\n    a.app_id AS app,\n    a.identity AS identity,\n    uniqExactIf(e.anon, e.dataset = 'measure' AND e.est_occurred_at >= now() - INTERVAL 7 DAY) AS actors_7d,\n    uniqExactIf(e.anon, e.dataset = 'measure' AND e.est_occurred_at < now() - INTERVAL 7 DAY) AS actors_prev_7d,\n    round(100 * (actors_7d - actors_prev_7d) / nullIf(actors_prev_7d, 0), 1) AS wow_pct,\n    countIf(e.event_name = a.north_star AND e.est_occurred_at >= now() - INTERVAL 7 DAY) AS north_star_7d,\n    round(100 * countIf(e.event_name = 'error.occurred' AND e.est_occurred_at >= now() - INTERVAL 7 DAY)\n        / nullIf(countIf(e.event_name = 'screen.viewed' AND e.est_occurred_at >= now() - INTERVAL 7 DAY), 0), 2)\n        AS errors_per_100_views,\n    dateDiff('second', max(e.received_at), now64(3)) AS freshness_s,\n    argMaxIf(e.release, e.est_occurred_at, e.event_name = 'screen.viewed') AS client_release\nFROM core.apps AS a\nLEFT JOIN (\n    SELECT app_id, event_name, est_occurred_at, received_at, release, dataset, user.anonymous_id AS anon\n    FROM core.events\n    WHERE env = '${env}' AND est_occurred_at >= now() - INTERVAL 14 DAY\n) AS e ON e.app_id = a.app_id\nGROUP BY a.app_id, a.identity\nORDER BY a.app_id",
                            "pluginVersion": "4.22.1"
                        }
                    ],
                    "fieldConfig": {
                        "defaults": {
                            "color": {
                                "mode": "palette-classic-by-name"
                            }
                        },
                        "overrides": [
                            {
                                "matcher": {
                                    "id": "byName",
                                    "options": "app"
                                },
                                "properties": [
                                    {
                                        "id": "links",
                                        "value": [
                                            {
                                                "title": "앱 상세",
                                                "url": "/d/telemetry-app?var-env=${env}&var-app=${__value.raw}&${__url_time_range}"
                                            }
                                        ]
                                    }
                                ]
                            },
                            {
                                "matcher": {
                                    "id": "byName",
                                    "options": "wow_pct"
                                },
                                "properties": [
                                    {
                                        "id": "unit",
                                        "value": "percent"
                                    },
                                    {
                                        "id": "displayName",
                                        "value": "전주 대비 %"
                                    }
                                ]
                            },
                            {
                                "matcher": {
                                    "id": "byName",
                                    "options": "freshness_s"
                                },
                                "properties": [
                                    {
                                        "id": "unit",
                                        "value": "s"
                                    },
                                    {
                                        "id": "displayName",
                                        "value": "freshness"
                                    }
                                ]
                            },
                            {
                                "matcher": {
                                    "id": "byName",
                                    "options": "errors_per_100_views"
                                },
                                "properties": [
                                    {
                                        "id": "displayName",
                                        "value": "오류 / 100 화면"
                                    }
                                ]
                            }
                        ]
                    },
                    "options": {}
                },
                {
                    "id": 3,
                    "type": "timeseries",
                    "title": "일별 활성 actor (KST)",
                    "description": "measure 데이터셋 익명 id 기준. 같은 사람이 기기를 바꾸면 둘로 센다.",
                    "datasource": {
                        "type": "grafana-clickhouse-datasource",
                        "uid": "clickhouse-telemetry"
                    },
                    "gridPos": {
                        "x": 0,
                        "y": 8,
                        "w": 12,
                        "h": 8
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "grafana-clickhouse-datasource",
                                "uid": "clickhouse-telemetry"
                            },
                            "editorType": "sql",
                            "format": 0,
                            "queryType": "timeseries",
                            "rawSql": "SELECT toStartOfDay(est_occurred_at, 'Asia/Seoul') AS time, app_id, uniqExact(user.anonymous_id) AS actors\nFROM core.events\nWHERE env = '${env}' AND dataset = 'measure' AND $__timeFilter(est_occurred_at)\nGROUP BY time, app_id\nORDER BY time",
                            "pluginVersion": "4.22.1"
                        }
                    ],
                    "fieldConfig": {
                        "defaults": {
                            "color": {
                                "mode": "palette-classic-by-name"
                            },
                            "custom": {
                                "lineWidth": 2,
                                "fillOpacity": 0,
                                "pointSize": 8,
                                "showPoints": "never",
                                "spanNulls": false,
                                "axisSoftMin": 0
                            }
                        },
                        "overrides": []
                    },
                    "options": {
                        "legend": {
                            "showLegend": true,
                            "displayMode": "list",
                            "placement": "bottom"
                        },
                        "tooltip": {
                            "mode": "multi",
                            "sort": "desc"
                        }
                    }
                },
                {
                    "id": 4,
                    "type": "timeseries",
                    "title": "시간당 이벤트",
                    "description": "",
                    "datasource": {
                        "type": "grafana-clickhouse-datasource",
                        "uid": "clickhouse-telemetry"
                    },
                    "gridPos": {
                        "x": 12,
                        "y": 8,
                        "w": 12,
                        "h": 8
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "grafana-clickhouse-datasource",
                                "uid": "clickhouse-telemetry"
                            },
                            "editorType": "sql",
                            "format": 0,
                            "queryType": "timeseries",
                            "rawSql": "SELECT toStartOfHour(est_occurred_at) AS time, app_id, count() AS events\nFROM core.events\nWHERE env = '${env}' AND $__timeFilter(est_occurred_at)\nGROUP BY time, app_id\nORDER BY time",
                            "pluginVersion": "4.22.1"
                        }
                    ],
                    "fieldConfig": {
                        "defaults": {
                            "color": {
                                "mode": "palette-classic-by-name"
                            },
                            "custom": {
                                "lineWidth": 2,
                                "fillOpacity": 0,
                                "pointSize": 8,
                                "showPoints": "never",
                                "spanNulls": false,
                                "axisSoftMin": 0
                            }
                        },
                        "overrides": []
                    },
                    "options": {
                        "legend": {
                            "showLegend": true,
                            "displayMode": "list",
                            "placement": "bottom"
                        },
                        "tooltip": {
                            "mode": "multi",
                            "sort": "desc"
                        }
                    }
                },
                {
                    "id": 5,
                    "type": "row",
                    "title": "수집 파이프라인",
                    "collapsed": false,
                    "gridPos": {
                        "x": 0,
                        "y": 16,
                        "w": 24,
                        "h": 1
                    },
                    "panels": []
                },
                {
                    "id": 6,
                    "type": "timeseries",
                    "title": "수락된 이벤트 / 분",
                    "description": "Prometheus(스크레이프 시각 기준). 백필은 보낸 순간에 몰려 보인다.",
                    "datasource": {
                        "type": "prometheus",
                        "uid": ""
                    },
                    "gridPos": {
                        "x": 0,
                        "y": 17,
                        "w": 8,
                        "h": 7
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "prometheus",
                                "uid": ""
                            },
                            "expr": "sum by (app) (rate(telemetry_events_accepted_total{env=\"$env\"}[5m])) * 60",
                            "legendFormat": "{{app}}",
                            "range": true,
                            "instant": false
                        }
                    ],
                    "fieldConfig": {
                        "defaults": {
                            "color": {
                                "mode": "palette-classic-by-name"
                            },
                            "custom": {
                                "lineWidth": 2,
                                "fillOpacity": 0,
                                "pointSize": 8,
                                "showPoints": "never",
                                "spanNulls": false,
                                "axisSoftMin": 0
                            }
                        },
                        "overrides": []
                    },
                    "options": {
                        "legend": {
                            "showLegend": true,
                            "displayMode": "list",
                            "placement": "bottom"
                        },
                        "tooltip": {
                            "mode": "multi",
                            "sort": "desc"
                        }
                    },
                    "timeFrom": "6h"
                },
                {
                    "id": 7,
                    "type": "table",
                    "title": "검증 거부 · 코드별 (수집기 시작 이후)",
                    "description": "거부된 이벤트는 저장하지 않고 코드별 숫자만 남긴다. 수집기가 재시작되면 0부터 다시 센다. increase()를 쓰지 않는 이유: 처음 나타난 라벨 조합의 첫 증가분을 Prometheus가 보지 못해 드문 거부가 아예 안 보인다.",
                    "datasource": {
                        "type": "prometheus",
                        "uid": ""
                    },
                    "gridPos": {
                        "x": 8,
                        "y": 17,
                        "w": 8,
                        "h": 7
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "prometheus",
                                "uid": ""
                            },
                            "expr": "sum by (app, code) (telemetry_events_rejected_total{env=\"$env\"})",
                            "legendFormat": "",
                            "range": false,
                            "instant": true,
                            "format": "table"
                        }
                    ],
                    "fieldConfig": {
                        "defaults": {
                            "color": {
                                "mode": "palette-classic-by-name"
                            }
                        },
                        "overrides": [
                            {
                                "matcher": {
                                    "id": "byName",
                                    "options": "rejected"
                                },
                                "properties": [
                                    {
                                        "id": "decimals",
                                        "value": 0
                                    }
                                ]
                            }
                        ]
                    },
                    "options": {
                        "sortBy": [
                            {
                                "displayName": "rejected",
                                "desc": true
                            }
                        ]
                    },
                    "transformations": [
                        {
                            "id": "organize",
                            "options": {
                                "excludeByName": {
                                    "Time": true
                                },
                                "renameByName": {
                                    "Value": "rejected"
                                }
                            }
                        }
                    ],
                    "timeFrom": "6h"
                },
                {
                    "id": 8,
                    "type": "timeseries",
                    "title": "스풀 대기 · 막힘",
                    "description": "pending이 줄지 않고 blocked가 1이면 ClickHouse 쪽 문제다. 데이터는 스풀에 남아 있다.",
                    "datasource": {
                        "type": "prometheus",
                        "uid": ""
                    },
                    "gridPos": {
                        "x": 16,
                        "y": 17,
                        "w": 8,
                        "h": 7
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "prometheus",
                                "uid": ""
                            },
                            "expr": "telemetry_spool_pending",
                            "legendFormat": "pending rows",
                            "range": true,
                            "instant": false
                        },
                        {
                            "refId": "B",
                            "datasource": {
                                "type": "prometheus",
                                "uid": ""
                            },
                            "expr": "max(telemetry_flush_blocked) or vector(0)",
                            "legendFormat": "flush blocked (1 = 막힘)",
                            "range": true,
                            "instant": false
                        }
                    ],
                    "fieldConfig": {
                        "defaults": {
                            "color": {
                                "mode": "palette-classic-by-name"
                            },
                            "custom": {
                                "lineWidth": 2,
                                "fillOpacity": 0,
                                "pointSize": 8,
                                "showPoints": "never",
                                "spanNulls": false,
                                "axisSoftMin": 0
                            }
                        },
                        "overrides": []
                    },
                    "options": {
                        "legend": {
                            "showLegend": true,
                            "displayMode": "list",
                            "placement": "bottom"
                        },
                        "tooltip": {
                            "mode": "multi",
                            "sort": "desc"
                        }
                    },
                    "timeFrom": "6h"
                },
                {
                    "id": 9,
                    "type": "table",
                    "title": "시각 품질 · 자동화 의심",
                    "description": "skewed: 기기 시계가 5분 넘게 틀린 이벤트(시각은 보정됨). lag: 발생부터 수신까지. demo 백필은 며칠 단위로 보인다.",
                    "datasource": {
                        "type": "grafana-clickhouse-datasource",
                        "uid": "clickhouse-telemetry"
                    },
                    "gridPos": {
                        "x": 0,
                        "y": 24,
                        "w": 24,
                        "h": 5
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "grafana-clickhouse-datasource",
                                "uid": "clickhouse-telemetry"
                            },
                            "editorType": "sql",
                            "format": 1,
                            "queryType": "table",
                            "rawSql": "SELECT\n    app_id AS app,\n    count() AS events,\n    round(100 * countIf(timing_quality = 'skewed') / count(), 2) AS skewed_pct,\n    round(100 * countIf(timing_quality = 'invalid') / count(), 2) AS invalid_pct,\n    round(100 * countIf(automation_suspected) / count(), 2) AS automation_pct,\n    round(quantile(0.5)(dateDiff('second', est_occurred_at, received_at)), 1) AS lag_p50_s,\n    round(quantile(0.95)(dateDiff('second', est_occurred_at, received_at)), 1) AS lag_p95_s\nFROM core.events\nWHERE env = '${env}' AND $__timeFilter(est_occurred_at)\nGROUP BY app_id\nORDER BY app_id",
                            "pluginVersion": "4.22.1"
                        }
                    ],
                    "fieldConfig": {
                        "defaults": {
                            "color": {
                                "mode": "palette-classic-by-name"
                            }
                        },
                        "overrides": []
                    },
                    "options": {}
                }
            ],
            "id": null
        }
    telemetry-app.json: |
        {
            "uid": "telemetry-app",
            "title": "Telemetry · App Product",
            "description": "앱 하나의 사용 흐름: 활성, 퍼널, 리텐션, 릴리스별 오류",
            "tags": [
