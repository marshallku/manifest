                            "format": 0,
                            "queryType": "timeseries",
                            "rawSql": "SELECT toStartOfDay(est_occurred_at, 'Asia/Seoul') AS time,\n       uniqExact(user.anonymous_id) AS actors,\n       uniqExact(session_id) AS sessions\nFROM core.events_sessionized\nWHERE app_id = '${app}' AND env = '${env}' AND dataset = 'measure' AND $__timeFilter(est_occurred_at)\nGROUP BY time\nORDER BY time",
