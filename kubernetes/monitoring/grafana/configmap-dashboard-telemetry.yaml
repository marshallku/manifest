                {
                    "id": 6,
                    "type": "bargauge",
                    "title": "퍼널 · ${funnel}",
                    "description": "레지스트리(core.funnels)의 단계와 창. 첫 단계 이후 창 안에 순서대로 일어난 단계까지 센다(windowFunnel). telemetry verify가 같은 SQL로 정답과 대조한다.",
                    "datasource": {
                        "type": "grafana-clickhouse-datasource",
                        "uid": "clickhouse-telemetry"
                    },
                    "gridPos": {
                        "x": 12,
                        "y": 3,
                        "w": 12,
                        "h": 8
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "grafana-clickhouse-datasource",
                                "uid": "clickhouse-telemetry"
                            },
                            "editorType": "sql",
                            "format": 1,
                            "queryType": "table",
                            "rawSql": "WITH (SELECT steps FROM core.funnels WHERE app_id = '${app}' AND name = '${funnel}') AS s\nSELECT concat(toString(step), '. ', s[step]) AS step_name,\n       countIf(level >= step) AS actors,\n       round(100 * actors / max(countIf(level >= 1)) OVER (), 1) AS pct_of_first\nFROM (\n    SELECT windowFunnel(${funnel_window})(toUInt64(toUnixTimestamp64Milli(est_occurred_at)),\n        event_name = s[1], event_name = s[2], event_name = s[3],\n        event_name = s[4], event_name = s[5], event_name = s[6]) AS level\n    FROM core.events\n    WHERE app_id = '${app}' AND env = '${env}' AND dataset = 'measure' AND $__timeFilter(est_occurred_at)\n    GROUP BY user.anonymous_id\n)\nARRAY JOIN range(1, length(s) + 1) AS step\nGROUP BY step\nORDER BY step",
                            "pluginVersion": "4.22.1"
                        }
                    ],
                    "fieldConfig": {
                        "defaults": {
                            "color": {
                                "mode": "fixed",
                                "fixedColor": "blue"
                            },
                            "unit": "short",
                            "min": 0
                        },
                        "overrides": []
                    },
                    "options": {
                        "orientation": "horizontal",
                        "displayMode": "basic",
                        "showUnfilled": true,
                        "valueMode": "text",
                        "namePlacement": "left",
                        "reduceOptions": {
                            "values": true,
                            "calcs": [],
                            "fields": "/^actors$/"
                        }
                    },
                    "transformations": [
                        {
                            "id": "organize",
                            "options": {
                                "excludeByName": {
                                    "pct_of_first": true
                                }
                            }
                        }
                    ]
                },
                {
                    "id": 7,
                    "type": "table",
                    "title": "리텐션 · 주간 코호트 (KST)",
                    "description": "Dn: 첫 방문 n일 뒤 그 날에 다시 온 비율. n일째가 아직 끝나지 않은 사용자는 분모에서 뺀다(빈 칸). session_only 앱은 익명 id가 방문마다 바뀌므로 항상 0이다.",
                    "datasource": {
                        "type": "grafana-clickhouse-datasource",
                        "uid": "clickhouse-telemetry"
                    },
                    "gridPos": {
                        "x": 0,
                        "y": 11,
                        "w": 12,
                        "h": 7
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "grafana-clickhouse-datasource",
                                "uid": "clickhouse-telemetry"
                            },
                            "editorType": "sql",
                            "format": 1,
                            "queryType": "table",
                            "rawSql": "WITH days AS (\n    SELECT user.anonymous_id AS a, toDate(est_occurred_at, 'Asia/Seoul') AS d\n    FROM core.events\n    WHERE app_id = '${app}' AND env = '${env}' AND dataset = 'measure' AND isNotNull(user.anonymous_id)\n    GROUP BY a, d\n), firsts AS (\n    SELECT a, min(d) AS first FROM days GROUP BY a\n), today AS (\n    SELECT toDate(now(), 'Asia/Seoul') AS t\n)\nSELECT toString(toMonday(first)) AS cohort_week,\n       count() AS users,\n       round(100 * countIf(first + 1 < (SELECT t FROM today) AND (a, first + 1) IN (SELECT a, d FROM days))\n           / nullIf(countIf(first + 1 < (SELECT t FROM today)), 0), 1) AS d1_pct,\n       round(100 * countIf(first + 7 < (SELECT t FROM today) AND (a, first + 7) IN (SELECT a, d FROM days))\n           / nullIf(countIf(first + 7 < (SELECT t FROM today)), 0), 1) AS d7_pct,\n       round(100 * countIf(first + 14 < (SELECT t FROM today) AND (a, first + 14) IN (SELECT a, d FROM days))\n           / nullIf(countIf(first + 14 < (SELECT t FROM today)), 0), 1) AS d14_pct\nFROM firsts\nWHERE first >= toDate($__fromTime, 'Asia/Seoul') AND first <= toDate($__toTime, 'Asia/Seoul')\nGROUP BY cohort_week\nORDER BY cohort_week",
                            "pluginVersion": "4.22.1"
                        }
                    ],
                    "fieldConfig": {
                        "defaults": {
                            "color": {
                                "mode": "palette-classic-by-name"
                            },
                            "custom": {
                                "cellOptions": {
                                    "type": "color-background",
                                    "mode": "basic"
                                }
                            }
                        },
                        "overrides": [
                            {
                                "matcher": {
                                    "id": "byRegexp",
                                    "options": "d.*_pct"
                                },
                                "properties": [
                                    {
                                        "id": "unit",
                                        "value": "percent"
                                    },
                                    {
                                        "id": "color",
                                        "value": {
                                            "mode": "continuous-blues"
                                        }
                                    },
                                    {
                                        "id": "min",
                                        "value": 0
                                    },
                                    {
                                        "id": "max",
                                        "value": 60
                                    }
                                ]
                            },
                            {
                                "matcher": {
                                    "id": "byName",
                                    "options": "users"
                                },
                                "properties": [
                                    {
                                        "id": "custom.cellOptions",
                                        "value": {
                                            "type": "auto"
                                        }
                                    }
                                ]
                            },
                            {
                                "matcher": {
                                    "id": "byName",
                                    "options": "cohort_week"
                                },
                                "properties": [
                                    {
                                        "id": "custom.cellOptions",
                                        "value": {
                                            "type": "auto"
                                        }
                                    }
                                ]
                            }
                        ]
                    },
                    "options": {}
                },
