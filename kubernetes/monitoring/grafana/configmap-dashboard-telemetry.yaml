            "panels": [
                {
                    "id": 1,
                    "type": "stat",
                    "title": "actors",
                    "description": "",
                    "datasource": {
                        "type": "grafana-clickhouse-datasource",
                        "uid": "clickhouse-telemetry"
                    },
                    "gridPos": {
                        "x": 0,
                        "y": 0,
                        "w": 6,
                        "h": 3
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "grafana-clickhouse-datasource",
                                "uid": "clickhouse-telemetry"
                            },
                            "editorType": "sql",
                            "format": 1,
