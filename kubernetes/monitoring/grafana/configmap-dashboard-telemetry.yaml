                            "uid": "clickhouse-telemetry"
                        },
                        "query": {
                            "editorType": "sql",
                            "rawSql": "SELECT app_id FROM core.apps ORDER BY app_id",
                            "format": 1,
                            "queryType": "table",
                            "pluginVersion": "4.22.1"
