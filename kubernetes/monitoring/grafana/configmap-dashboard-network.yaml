                    "datasource": {
                        "type": "prometheus",
                        "uid": ""
                    },
                    "fieldConfig": {
                        "defaults": {
                            "unit": "percentunit",
                            "custom": {
                                "fillOpacity": 10,
                                "showPoints": "never",
                                "spanNulls": false
                            },
                            "min": 0,
                            "max": 1,
                            "interval": "1m"
                        },
                        "overrides": []
                    },
                    "options": {
                        "legend": {
                            "displayMode": "table",
                            "placement": "right",
                            "calcs": [
                                "mean",
                                "max"
                            ]
                        },
                        "tooltip": {
                            "mode": "multi",
                            "sort": "desc"
                        }
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "prometheus",
                                "uid": ""
                            },
                            "expr": "clamp(1 - sum by (host) (increase(smokeping_response_duration_seconds_count[$__rate_interval])) / (sum by (host) (increase(smokeping_requests_total[$__rate_interval])) > 0), 0, 1)",
