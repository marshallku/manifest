# "Homelab Network" — line quality (smokeping), WAN and per-segment traffic
# (pve02 tap counters), switch01 ports (SNMP). What each probe can and cannot
# see is in kubernetes/monitoring/smokeping/.
apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-dashboard-network
    namespace: mgmt01
    labels:
        app: grafana
data:
    network.json: |
