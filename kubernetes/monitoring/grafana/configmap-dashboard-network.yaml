            "graphTooltip": 1,
            "id": null,
            "links": [],
            "refresh": "30s",
            "schemaVersion": 39,
            "tags": [
                "network",
                "smokeping",
                "snmp",
                "opnsense"
            ],
            "templating": {
                "list": []
