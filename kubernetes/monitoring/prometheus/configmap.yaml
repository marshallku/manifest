apiVersion: v1
kind: ConfigMap
metadata:
    name: prometheus-config
    namespace: mgmt01
    labels:
        app: prometheus
data:
    prometheus.yml: |
        global:
          scrape_interval: 15s
          evaluation_interval: 15s

        scrape_configs:
          - job_name: prometheus
            static_configs:
              - targets:
                  - localhost:9090

          - job_name: node-exporter
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - mgmt01
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                regex: node-exporter
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_pod_ip]
                regex: (.+)
                target_label: __address__
                replacement: $1:9100

          - job_name: cadvisor
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - mgmt01
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                regex: cadvisor
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: instance
              - source_labels: [__meta_kubernetes_pod_ip]
                regex: (.+)
                target_label: __address__
                replacement: $1:8080

          - job_name: loki
            static_configs:
              - targets:
                  - loki:3100

          # Mac mini (M4 Pro) — native darwin node_exporter, not a cluster node.
          # Scraped over LAN on its WIRED address (en0). `.141` was stale and the
          # target sat `up == 0`; the machine answers on `.114`, which is also
          # what edge01's nginx upstreams use. `.103` is its Wi-Fi and is
          # deliberately not used — a target that only works when the wireless
          # link is up is worse than one that is honestly down. Keep the DHCP
          # reservation for 192.168.219.114.
          - job_name: mac-mini
            static_configs:
              - targets:
                  - 192.168.219.114:9100
                labels:
                  instance: mac-mini
                  node: mac-mini

          # pi01 (Raspberry Pi 4B) — runs the secondary AdGuard and the external
          # uptime probe, deliberately outside the cluster (and off pve02) so a
          # cluster outage does not take LAN DNS and alerting with it. Same
          # LAN-scrape arrangement as the Mac mini; keep the DHCP reservation
          # for 192.168.219.127.
          - job_name: pi01
            static_configs:
              - targets:
                  - 192.168.219.127:9100
                labels:
                  instance: pi01
                  node: pi01
