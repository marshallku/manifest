apiVersion: v1
kind: ConfigMap
metadata:
    name: prometheus-config
    namespace: mgmt01
    labels:
        app: prometheus
data:
    prometheus.yml: |
        global:
          scrape_interval: 15s
          evaluation_interval: 15s

        scrape_configs:
          - job_name: prometheus
            static_configs:
              - targets:
                  - localhost:9090

          - job_name: node-exporter
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - mgmt01
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                regex: node-exporter
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_pod_ip]
                regex: (.+)
                target_label: __address__
                replacement: $1:9100

          # Container metrics come from the kubelet's built-in cAdvisor, not from
          # the standalone cAdvisor DaemonSet that used to sit here. That DaemonSet
          # mounted /var/lib/docker and /var/run expecting a Docker socket; k3s01
          # runs containerd, so cAdvisor fell back to its raw-cgroup handler and
          # emitted only an `id` label (a cgroup path). Every panel keyed on `name`
          # or `pod` was therefore No Data while the target still reported up == 1.
          # The kubelet endpoint labels each series with namespace/pod/container,
          # which is what the dashboards query.
          - job_name: kubelet-cadvisor
            scheme: https
            metrics_path: /metrics/cadvisor
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              # k3s signs the kubelet serving cert with its own per-node CA, which
              # the in-cluster CA bundle does not chain to. Verifying here would
              # only ever fail.
              insecure_skip_verify: true
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - source_labels: [__meta_kubernetes_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_node_name]
                target_label: instance

          # app01 — the Docker host. Not a cluster node, so the kubelet job above
          # does not see any of its containers and the node-exporter DaemonSet
          # never lands on it; both exporters run as plain containers there
          # (docker-compose/monitoring/) and are scraped from the servers segment,
          # the same arrangement as pi01 and the Mac mini. app01's address is
          # static in its netplan (10.20.0.21 since 2026-10-17).
          - job_name: app01
            static_configs:
              - targets:
                  - 10.20.0.21:9100
                labels:
                  instance: app01
                  node: app01

          - job_name: app01-cadvisor
            static_configs:
              - targets:
                  - 10.20.0.21:8080
                labels:
                  instance: app01
                  node: app01

          - job_name: loki
            static_configs:
              - targets:
                  - loki:3100

          # Mac mini (M4 Pro) — native darwin node_exporter, not a cluster node.
          # Scraped over LAN on its WIRED address (en0), dev 10.10.0.50 since
          # 2026-10-17 (DHCP reservation). Its Wi-Fi is deliberately not used —
          # a target that only works when the wireless link is up is worse than
          # one that is honestly down.
          - job_name: mac-mini
            static_configs:
              - targets:
                  - 10.10.0.50:9100
                labels:
                  instance: mac-mini
                  node: mac-mini

          # pve02 — the hypervisor, Debian's prometheus-node-exporter bound to its
          # LAN address (infra bootstrap/pve02.sh). Besides the host itself this
          # is where OPNsense's traffic is read: each tap200iN is one OPNsense
          # vNIC (i0 LAN, i1 WAN, i2 SERVERS, i3 LAB, i4 IoT, i5 GUEST), counted
          # from the host side so rx/tx are the VM's tx/rx. nic1 is WAN's only
          # physical port.
          - job_name: pve02
            static_configs:
              - targets:
                  - 10.10.0.20:9100
                labels:
                  instance: pve02
                  node: pve02

          # Line quality — ICMP RTT/loss from k3s01 through OPNsense to the ISP
          # and beyond (kubernetes/monitoring/smokeping/).
          - job_name: smokeping
            static_configs:
              - targets:
                  - smokeping:9374

          # switch01 per-port counters via snmp_exporter. The target is the
          # switch; __address__ is rewritten to the exporter.
          - job_name: switch01
            metrics_path: /snmp
            params:
              module: [if_mib]
              auth: [switch01]
            static_configs:
              - targets:
                  - 10.10.0.10
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - target_label: instance
                replacement: switch01
              - target_label: __address__
                replacement: snmp-exporter:9116

          # pi01 (Raspberry Pi 4B) — runs the secondary AdGuard and the external
          # uptime probe, deliberately outside the cluster (and off pve02) so a
          # cluster outage does not take LAN DNS and alerting with it. Same
          # LAN-scrape arrangement as the Mac mini; keep the DHCP reservation
          # for 10.10.0.30 (dev, since 2026-10-17; .127 stays as a static
          # secondary only for the ESP32 shelf display until it is reflashed).
          - job_name: pi01
            static_configs:
              - targets:
                  - 10.10.0.30:9100
                labels:
                  instance: pi01
                  node: pi01
